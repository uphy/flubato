name: preview-cleanup

# PR を閉じたら（merge を含む）、その PR 専用のプレビュー（ci.yml の preview が作る Worker `flubato-pr-<番号>`）を消す。
# 放っておくとアカウントに溜まり続ける
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    # プレビューを立てるのはこのリポジトリのブランチの PR だけ（ci.yml の preview と同じ条件）
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # ci.yml の preview と同じグループ。プレビューが上げている途中なら、終わるのを待ってから消す
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: プレビューの Worker を消す
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # preview が走らなかった PR では Worker が無いので、失敗にしない
          node tools/prepare-preview.mjs
          npx wrangler delete -c .wrangler-preview.json --force || echo "Worker flubato-pr-${PR_NUMBER} は無いか、消せなかった"
